name: CI

# Lint, format, and the fast test suite. Nothing here downloads a model, trains, or
# benchmarks: the deployment measurements in this study are taken by hand on a known,
# idle CPU (see docs/benchmarking_protocol.md), so a shared CI runner could not produce
# a comparable number even if it tried.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Hard guarantee that no test can reach the Hugging Face Hub. Any code path that tries
  # to download a checkpoint fails loudly instead of silently pulling gigabytes.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  check:
    name: lint, format, fast tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The Qwen provenance test reconstructs its evidence from commit 2832914.
          # A shallow checkout cannot verify that historical source object.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install the project and development dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheel explicitly: the default index would pull a multi-gigabyte CUDA
          # build that this workflow has no use for. Matches the README's install path.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . -r requirements-dev.txt

      - name: Report the resolved environment
        run: |
          python --version
          pip --version
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
          python -c "import scale_aware_compression as s; print('package', s.__version__)"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Fast test suite
        # Markers are declared in pyproject.toml. `requires_torch` tests DO run here -- torch is
        # installed above, and they cover the real compression and evaluation paths against a
        # tiny randomly initialised model. Only `requires_model` (needs downloaded weights) and
        # `slow` are excluded.
        run: pytest -m "not slow and not requires_model"

      - name: Confirm the fast suite needs neither torch nor the network
        # The library keeps torch and transformers imports lazy on purpose, and the tests
        # assert it. This step proves the property end to end: the same suite must pass in
        # an interpreter that has no torch installed at all, which is what makes config
        # validation and `sajc info` usable on a machine without the modelling stack.
        run: |
          python -m venv /tmp/minimal-env
          /tmp/minimal-env/bin/python -m pip install --quiet --upgrade pip
          /tmp/minimal-env/bin/python -m pip install --quiet pytest pyyaml psutil
          /tmp/minimal-env/bin/python -m pytest -q \
            -m "not slow and not requires_model and not requires_torch"

      - name: Verify no run artefacts were produced
        # The suite must not write checkpoints, metrics, or figures as an import or test side
        # effect. If any appear, something ran that should not have.
        #
        # Asks git what CHANGED rather than listing every file present. The original form --
        # `find outputs results -type f ! -name '.gitkeep'` -- was written when nothing under
        # those directories was tracked. The committed evidence set, figures and tables are now
        # deliberately in the repository, so a bare find reports ~30 legitimate files and fails
        # every run. What matters is whether the suite CREATED or MODIFIED anything, which is
        # exactly what `git status --porcelain` answers.
        run: |
          set -euo pipefail
          unexpected=$(git status --porcelain -- outputs results)
          if [ -n "$unexpected" ]; then
            echo "CI created or modified files under outputs/ or results/:"
            echo "$unexpected"
            exit 1
          fi
          echo "No run artefacts were created or modified, as expected."
