# Pythia-160M -- smallest point in the scale sweep.
#
# Fast enough to use as the pilot model: a full five-arm run fits in a single session, which
# makes it the right place to shake out a pipeline change before spending time at 1B.

model:
  name: pythia-160m
  size_label: 160M
  hf_id: EleutherAI/pythia-160m
  # REVISION POLICY (see docs/reproducibility.md#model-revisions)
  #   pilot / exploratory runs : null is acceptable
  #   final paper results      : MUST be a 40-character commit SHA
  # `null` resolves to whatever `main` points at today, and a Hub repository can be updated in
  # place -- so an unpinned run may silently load different weights months later. A branch name or
  # tag is not a pin; both can move. Look the SHA up with the snippet in docs/reproducibility.md
  # and paste it here. Do not copy a SHA from documentation and do not guess one.
  # Resolved from the Hub on 2026-07-28 via HfApi().model_info(..., revision="main").sha
  revision: 50f5173d932e8e61f858120bcb800b97af589f46
  device: auto
  dtype: float32
  trust_remote_code: false
  eval_mode: true
  local_files_only: false
  attn_implementation: null

runtime:
  # 512-token windows and small batches keep the pilot inside modest memory.
  output_dir: outputs

data:
  sequence_length: 512
  batch_size: 8
