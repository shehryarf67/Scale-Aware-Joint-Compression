# Pythia-1B -- third point in the scale sweep.
#
# The smallest size at which a three-point trend can be fitted, so this run is not optional.
# ~4 GB in FP32 before optimiser state; joint training will need gradient accumulation on
# consumer GPUs.

model:
  name: pythia-1b
  size_label: 1B
  hf_id: EleutherAI/pythia-1b
  # REVISION POLICY (see docs/reproducibility.md#model-revisions)
  #   pilot / exploratory runs : null is acceptable
  #   final paper results      : MUST be a 40-character commit SHA
  # Look the SHA up with the snippet in docs/reproducibility.md and paste it here. Do not copy a
  # SHA from documentation and do not guess one; a branch name or tag is not a pin.
  # Resolved from the Hub on 2026-07-28 via HfApi().model_info(..., revision="main").sha
  revision: f73d7dcc545c8bd326d8559c8ef84ffe92fea6b2
  device: auto
  dtype: float32
  trust_remote_code: false
  eval_mode: true
  local_files_only: false
  attn_implementation: null

runtime:
  output_dir: outputs

data:
  sequence_length: 512
  batch_size: 2

compression:
  recovery:
    batch_size: 1
    gradient_accumulation_steps: 4
  joint:
    batch_size: 1
    gradient_accumulation_steps: 4
