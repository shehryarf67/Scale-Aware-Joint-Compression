# CPU deployment benchmark. See docs/benchmarking_protocol.md.
#
# Every value here is fixed on purpose. Thread count, batch size, and sequence length all change
# measured latency, so they are pinned and recorded rather than left to the machine's defaults.
# Two runs that differ in any of them are not comparable and must not appear in the same figure.

benchmark:
  # Not overridable: a latency measured on GPU is not a deployment number for this study. The
  # config loader rejects any other value.
  device: cpu

  # Pinned thread count. 4 is a realistic commodity deployment and small enough that the
  # measurement is not dominated by thread scheduling. Sweep it separately
  # (--override benchmark.num_threads=1) to see how sparsity benefits scale with parallelism;
  # never average across different values.
  num_threads: 4
  interop_threads: null

  # Untimed iterations that settle allocator state, cache contents, and kernel selection. The
  # first call to a quantised CPU kernel is often several times slower than the steady state, so
  # a zero-warmup measurement mostly measures that one-off cost.
  warmup_runs: 5

  # Timed iterations. 30 is enough for a stable median and a meaningful p95; the runner warns if
  # the coefficient of variation exceeds 15%, which usually means background load.
  measured_runs: 30

  batch_size: 1
  sequence_length: 128

  # 0 = time a single forward pass (prefill). Set >0 to time autoregressive decoding instead,
  # which is the workload where memory bandwidth dominates and quantisation helps most.
  generated_tokens: 0

  record_per_run_latencies: true
  # Fail rather than warn when torch will not honour the requested thread count: a silently
  # unpinned run produces numbers that look fine and are not comparable.
  fail_on_thread_mismatch: true
