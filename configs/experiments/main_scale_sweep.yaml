# Main scale sweep: the experiment that answers the research question.
#
#   independent variable : model scale (160M -> 410M -> 1B)
#   dependent variables  : quality retention, checkpoint size, CPU latency, throughput, memory
#   controlled           : dataset, tokenisation window, calibration set, sparsity target,
#                          bit width, optimisation budget, benchmark thread count / batch size /
#                          sequence length, seed set
#
# Grid: models x arms x budgets x seeds, as listed under `sweep:` below. Run
# `sajc sweep --config configs/experiments/main_scale_sweep.yaml --plan-only` to see the exact
# expansion before committing compute -- the plan is the authority on the run count, not a comment.
# Prune it while iterating: --override sweep.seeds='[1234]' or --override sweep.budgets='[moderate]'.
#
# Three scale points, deliberately. pythia-1.4b is NOT in the default sweep: joint training at that
# size may need different batch sizes, gradient accumulation, or reduced precision, and a fourth
# point measured under different training settings is worse than no fourth point at all. It lives in
# extended_scale_sweep.yaml, to be run only after this sweep succeeds and only if it can be run with
# comparable settings.
#
# BACKEND RISK -- read before running the aggressive budget. PyTorch's native CPU quantisation
# support is strongest for INT8; 4-bit weight-only CPU deployment generally needs a separate
# backend. If a single 4-bit CPU path cannot be implemented for BOTH the sequential and joint arms,
# use the documented INT8 fallback for the aggressive budget (70% sparsity, INT8) rather than
# comparing arms across two different runtimes or artefact formats. See docs/method_definition.md
# and docs/benchmarking_protocol.md. This decision must be made before the main experiments start.

include:
  - ../models/pythia_160m.yaml
  - ../compression/sequential.yaml
  - ../evaluation/quality.yaml
  - ../evaluation/cpu_benchmark.yaml

experiment:
  id: main_scale_sweep
  name: Main Pythia scale sweep
  description: >-
    All five compression arms across three Pythia sizes (160M, 410M, 1B) at two compression budgets
    and three seeds. Joint gain is computed per (model, budget, seed) from the matched sequential and
    joint runs. The optional 1.4B point lives in extended_scale_sweep.yaml.
  tags:
    - main
    - scale-sweep
    - pythia

runtime:
  seed: 1234
  deterministic: true
  output_dir: outputs
  log_level: INFO

# CONFIRMATORY EVALUATION USES THE HELD-OUT TEST SPLIT (Amendment A1 §5.2).
#
# The budgets were chosen by looking at validation results, which makes validation a SELECTION
# SURFACE: reporting the headline on it would compute the primary evidence on data already used to
# make a choice. Screening, order selection and the mechanistic controls stay on validation; only
# final reporting moves here.
#
# There is no leakage either way -- calibration is drawn from `train` and always was. This is about
# selection bias, not contamination.
#
# Credit where due: this was caught by the partner's phase7-close-phase8-setup branch. The replicate
# axis was implemented here without switching the split, so the confirmatory configs would have run
# eight paired draws and then reported them on the selection surface.
data:
  eval_split: test

sweep:
  # Three scale points spanning roughly one order of magnitude. Enough to establish the direction of
  # a trend; not enough to fit a scaling law, and the write-up must not claim one.
  models:
    - pythia-160m
    - pythia-410m
    - pythia-1b
  # Dense first: every other arm needs that model's dense perplexity as its retention reference.
  methods:
    - dense
    - pruning
    - quantisation
    - sequential
    - joint
  budgets:
    - moderate
    - aggressive
  # Eight PAIRED CALIBRATION REPLICATES per cell, per Amendment A1 §5.1 and §6.
  #
  # This replaces the three-seed protocol, which measured nothing: the pipeline is deterministic
  # post-training reconstruction, so two runs at different run seeds produce bit-identical output
  # (findings_log.md F-15). Three seeds gave three identical numbers and a seed spread of exactly
  # zero, which made §6.3's "must exceed the seed spread" clause pass for any nonzero gain.
  #
  # A replicate varies the CALIBRATION DRAW, which changes the Gram matrix, hence the mask and the
  # scales, hence a genuinely different compressed model. Replicate r uses
  # constants.CALIBRATION_REPLICATE_SEEDS[r], and every arm in a comparison uses the same r -- that
  # pairing is what §3.11 requires within a comparison and what §6.3 asks for.
  #
  # Eight rather than five because the statistical constraint is a cliff, not a slope: at R=5 the best
  # possible outcome (every replicate agreeing in sign) carries an exact two-sided probability of
  # 2/2^5 = 0.0625, so no significance claim exists at any effect size. R=8 reaches 0.008.
  #
  # Pythia-1B runs five instead, via replicates_by_model below: a 1B replicate costs roughly four
  # times a 160M one, and that is where the marginal hour stops buying enough power to justify itself.
  # The smaller count takes the FIRST five seeds, so the 1B draws are a strict subset of these rather
  # than a different set -- replicate 3 means the same calibration draw at every scale, which is what
  # lets a scale trend be read as a scale trend.
  replicates: 8
  replicates_by_model:
    pythia-1b: 5

  budget_overrides:
    # =============================================================================================
    # FROZEN 2026-07-29 from the Phase 7 screening grid. Evidence: findings_log.md F-10 and F-13,
    # plus outputs/tables/screening_summary.md.
    #
    # DO NOT CHANGE. The budget is a controlled variable across scales (§2.5), and §6.3 forbids
    # revisiting the choice once results exist. Superseded pair, for the record: the original
    # moderate/aggressive was 50% + W8 and 70% + W4. Screening measured BOTH as catastrophic on
    # Pythia-160M -- 22.9% and 0.8% retention. Since the smallest model sets the ceiling for all
    # three, neither was usable anywhere.
    #
    # The frozen pair varies PRECISION, not sparsity: both budgets prune 30%. The sparsity-versus-
    # latency curve (RQ4) therefore does not come from these budgets. It comes from benchmark-only
    # runs of the pruning-only arm at several sparsities, which are cheap because that arm stays FP32
    # and a latency measurement does not need the full quality evaluation.
    # =============================================================================================

    # MODERATE = screening S1. 30% sparsity, 8-bit.
    #
    # Pythia-160M, 493x512 window, dense 36.97:
    #     sequential 45.97 (80.4% retention)   joint 45.90 (80.6%)   gain +0.12 pp
    #
    # This is the CONTROL budget. F-05 measured the joint mechanism as near-inert at 8 bits -- the
    # arms pick masks differing in only 0.46% of positions -- so a joint gain near zero here is the
    # EXPECTED result rather than a failure. Reporting it as a scale-independent null about pipeline
    # design would be a misreading of the design.
    moderate:
      compression:
        budget_label: moderate
        pruning:
          sparsity: 0.3
        quantisation:
          bits: 8

    # AGGRESSIVE = screening S5. 30% sparsity, 4-bit.
    #
    # Pythia-160M, matched solver budgets:
    #     sequential 66.03 (56.0% retention)   joint 71.87 (51.4%)   gain -4.55 pp
    #
    # Chosen over the 40% + W8 alternative for one reason: 4-bit is the ONLY regime where the joint
    # mechanism is measurably live -- 8.86% mask divergence at W4 against 0.46% at W8 (F-05). Two
    # 8-bit budgets could not detect the effect this study exists to measure, and would produce a
    # confident null that was an artefact of the design rather than a finding about nature.
    #
    # It is also the only eligible budget where the two arms measurably differ, and joint is the
    # WORSE one. That is a hypothesis worth testing, not a reason to avoid the budget.
    #
    # Per decision D1 this budget contributes quality and size only. It never appears in a latency
    # table, because a packed 4-bit CPU linear would measure the dequantisation kernel.
    aggressive:
      compression:
        budget_label: aggressive
        pruning:
          sparsity: 0.3
        quantisation:
          bits: 4

    # ---------------------------------------------------------------------------------------------
    # DOCUMENTED FALLBACK -- intentionally commented out, not merely disabled.
    #
    # Use it if a single 4-bit CPU backend cannot be implemented for BOTH arms. Replace the
    # `aggressive` block above with the two lines below; it holds sparsity as the aggressive variable
    # and keeps the bit width on the well-supported INT8 path, so every row in the study shares one
    # runtime and one artefact format.
    #
    #     aggressive:
    #       compression:
    #         budget_label: aggressive
    #         pruning:
    #           sparsity: 0.7          # unchanged: sparsity stays the aggressive variable
    #         quantisation:
    #           bits: 8                # was 4
    #
    #   moderate            : 50% sparsity, INT8
    #   aggressive fallback : 70% sparsity, INT8
    #
    # Two consequences to state explicitly in the write-up if the fallback is used:
    #   1. precision becomes a constant rather than a second compression axis, so the study varies
    #      only sparsity across budgets;
    #   2. the compression-ratio range narrows from ~8x-27x to ~8x-13x.
    #
    # It is left commented rather than added as an extra budget on purpose: SweepConfig rejects a
    # budget_overrides entry that is not listed under `budgets`, which catches typos in budget names,
    # and adding a third live budget would silently grow the sweep by half.
    # ---------------------------------------------------------------------------------------------

  # HONOUR THE FROZEN SEQUENTIAL ORDER. §6.1 measures joint gain against best-of {P->Q, Q->P}, and
  # the frozen table has one cell where the winner is Q->P: pythia-1b at the moderate budget
  # (F-32, +0.10 pp, 3/3 draws). Without this flag a `sequential` cell means P->Q everywhere, so this
  # sweep would run the WEAKER baseline at 1B/moderate and inflate the joint gain there -- B-30's
  # fault, in the one run that cannot be redone. Resolution comes from
  # scale_aware_compression.protocol, which is the single machine-readable source; a test asserts
  # every test-split config sets this.
  use_frozen_order: true

  # Resumable: an interrupted sweep re-runs only the cells with no record yet.
  skip_existing: true
  # Amendment A2: this multi-day run continues after a failed cell. Failed records are never valid
  # resume candidates, and scripts/audit_confirmatory_run.py must pass before any analysis begins.
  continue_on_error: true

benchmark:
  num_threads: 4
  warmup_runs: 5
  measured_runs: 30
  batch_size: 1
  sequence_length: 128
