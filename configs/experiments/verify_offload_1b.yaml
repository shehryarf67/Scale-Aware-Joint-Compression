# Does Pythia-1B compress within the VRAM ceiling once blocks are offloaded? (verification)
#
# This is the question per-block offload exists to answer. Measured with the whole model resident,
# 1B peaks at **6.31 GiB on a 6.00 GiB card** ([F-29](../docs/findings_log.md#f-29)) -- it completed
# only by spilling into host memory, which made the widest-layer solve 33.9 s against 4.8 s
# standalone. §5.2 wants peak under 85% of the card, a **5.1 GiB ceiling**.
#
# `block_size` is not the lever: peak was 6.31 / 6.37 / 6.37 GiB at 128 / 64 / 32, because the Gram
# factorisation dominates rather than the block loop. Residency is the lever.
#
# Used with scripts/verify_block_offload.py --peak-only, which runs compression alone. The resident
# comparison is impossible here by construction -- that path is the one that does not fit -- so
# equivalence is established at 160M, where both paths run and the right answer is already known,
# and this config measures only what offload was for.
#
#     python scripts/verify_block_offload.py --config configs/experiments/verify_offload_1b.yaml \
#         --peak-only
#
# Not a sweep config and not a result. It produces a memory measurement, not a perplexity.

include:
  - ../models/pythia_1b.yaml
  - ../compression/sequential.yaml
  - ../evaluation/quality.yaml
  - ../evaluation/cpu_benchmark.yaml

experiment:
  id: verify_offload_1b
  name: Per-block offload peak memory on Pythia-1B
  description: >-
    Compression-only run of Pythia-1B with block offload enabled, to measure peak GPU memory
    against the 5.1 GiB ceiling §5.2 sets for the scale sweep.
  tags:
    - verification
    - not-a-result

runtime:
  seed: 1234
  deterministic: true
  output_dir: outputs
  log_level: INFO

model:
  # The whole point: everything but the resident block stays here.
  device: cpu

data:
  # Matched to the screening grid, so the memory measured is the memory a real cell would use
  # rather than an optimistic one taken at a smaller calibration size.
  calibration_samples: 128
  calibration_split: train
  sequence_length: 512
  max_eval_samples: 512
  batch_size: 4

compression:
  # The aggressive budget: W4 is where the joint mechanism is live, so it is the cell that has to
  # fit. The bit width does not change residency, but matching the real budget keeps the solve
  # shapes honest.
  budget_label: aggressive
  pruning:
    sparsity: 0.3
  quantisation:
    bits: 4
  reconstruction:
    solver: sweep
    local_steps: 1
    joint_iterations: 2
    comparison_group: output
    scale_search: false
    keep_benefit_saliency: false
    offload_blocks: true
