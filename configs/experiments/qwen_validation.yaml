# External validation on Qwen2.5-0.5B.
#
# Tests whether a joint-gain trend found within Pythia is a property of transformer compression or
# of Pythia specifically. Not a fifth sweep point.
#
# What is held identical to the main sweep: arms, budgets, seeds, evaluation corpus and window,
# calibration sample count, optimisation budget, and the entire benchmark configuration. If any of
# those changed, a difference in outcome could not be attributed to the model family.
#
# What cannot be compared: absolute perplexity. Qwen2.5 has a different tokeniser, vocabulary, and
# training corpus, so its perplexity is on a different scale from Pythia's. Only retention ratios
# and the sign and rough magnitude of the joint gain transfer. See docs/methodology.md.

include:
  - ../models/qwen2_5_0_5b.yaml
  - ../compression/sequential.yaml
  - ../evaluation/quality.yaml
  - ../evaluation/cpu_benchmark.yaml

experiment:
  id: qwen_validation
  name: Qwen2.5-0.5B external validation
  description: >-
    The same five arms, budgets, and seeds as the main sweep, applied to a different model family.
    Compared against the Pythia trend interpolated at 0.5B parameters -- which falls between
    pythia-410m and pythia-1b.
  tags:
    - validation
    - external
    - qwen

runtime:
  seed: 1234
  deterministic: true
  output_dir: outputs
  log_level: INFO

# CONFIRMATORY EVALUATION USES THE HELD-OUT TEST SPLIT (Amendment A1 §5.2).
#
# The budgets were chosen by looking at validation results, which makes validation a SELECTION
# SURFACE: reporting the headline on it would compute the primary evidence on data already used to
# make a choice. Screening, order selection and the mechanistic controls stay on validation; only
# final reporting moves here.
#
# There is no leakage either way -- calibration is drawn from `train` and always was. This is about
# selection bias, not contamination.
#
# Credit where due: this was caught by the partner's phase7-close-phase8-setup branch. The replicate
# axis was implemented here without switching the split, so the confirmatory configs would have run
# eight paired draws and then reported them on the selection surface.
data:
  eval_split: test

sweep:
  models:
    - qwen2.5-0.5b
  methods:
    - dense
    - pruning
    - quantisation
    - sequential
    - joint
  budgets:
    - moderate
    - aggressive
  # Eight paired calibration replicates, matching main_scale_sweep.yaml. The run-seed axis it used to
  # carry was withdrawn by Amendment A1 §5.1: seeds are inert under this method (F-15), so three of
  # them produced three identical numbers. This check only means something if the external model is
  # compressed and measured under the *same* protocol as the Pythia sweep, replicate count included.
  replicates: 8

  # Identical to main_scale_sweep.yaml. Keep the two in step: a budget that differs between the
  # sweep and the validation makes the transfer check meaningless.
  # Identical to the Pythia sweep's frozen budgets, and that is a requirement rather than a
  # convenience: §2.4 compares Qwen's joint gain against the Pythia trend interpolated at its
  # parameter count, which is meaningless if the two ran at different compression budgets. A test
  # asserts the two configs agree.
  #
  # Frozen 2026-07-29 from Phase 7 screening. Superseded pair: 50% + W8 and 70% + W4, both measured
  # catastrophic on Pythia-160M. See findings_log.md F-10 and F-13.
  budget_overrides:
    moderate:
      compression:
        budget_label: moderate
        pruning:
          sparsity: 0.3
        quantisation:
          bits: 8
    aggressive:
      compression:
        budget_label: aggressive
        pruning:
          sparsity: 0.3
        quantisation:
          bits: 4

  skip_existing: true
  continue_on_error: false

# Tied embeddings: lm_head shares weights with model.embed_tokens, so excluding one without the
# other would compress the input embedding as a side effect. Both are excluded here and in
# ../models/qwen2_5_0_5b.yaml.
compression:
  pruning:
    exclude_patterns:
      - embed_tokens
      - lm_head
  quantisation:
    exclude_patterns:
      - embed_tokens
      - lm_head

benchmark:
  num_threads: 4
  warmup_runs: 5
  measured_runs: 30
  batch_size: 1
  sequence_length: 128
